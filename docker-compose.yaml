services:
  postgres:
    image: postgres:17-alpine
    container_name: user-service-postgres
    environment:
      POSTGRES_DB: ${AUTH_SERVICE_DB_NAME}
      POSTGRES_USER: ${AUTH_SERVICE_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_SERVICE_DB_PASSWORD:?Set AUTH_SERVICE_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${AUTH_SERVICE_DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  auth-service:
    image: auth-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${AUTH_SERVICE_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${AUTH_SERVICE_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${AUTH_SERVICE_DB_PASSWORD:?Set AUTH_SERVICE_DB_PASSWORD in .env}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: ${AUTH_SERVICE_REDIS_PORT:-6379}
      SPRING_DATA_REDIS_PASSWORD: ${AUTH_SERVICE_REDIS_PASSWORD}
      JWT_PRIVATE_KEY_PATH: ${JWT_PRIVATE_KEY_PATH}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH}
      USER_SERVICE_URL: ${USER_SERVICE_URL}
    ports:
      - "${AUTH_SERVICE_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data: